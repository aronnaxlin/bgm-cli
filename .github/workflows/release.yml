name: Release

# Versions live in git tags (vX.Y.Z), not in the source tree.
#
# - A push to main that has commits since the latest tag releases the next
#   patch version automatically (scripts/next-version.sh). Put [skip release]
#   in the head commit subject to opt out.
# - Pushing a v* tag by hand releases exactly that version.
#
# Either way the version is stamped into package.json inside the runner right
# before `npm publish`; it is never committed back.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

# One release at a time, so two pushes never compute the same next version.
concurrency:
  group: release-${{ github.event_name == 'pull_request' && github.ref || 'main-and-tags' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  version:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Decide the version to release
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Tag $GITHUB_REF_NAME is not vX.Y.Z" >&2
              exit 1
            fi
          else
            version="$(scripts/next-version.sh "$GITHUB_SHA")"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version to release: ${version:-<nothing new>}"

  github-release:
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Creates the tag at the pushed commit when it does not exist yet. Tags
      # made with GITHUB_TOKEN do not start another run of this workflow.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true

  publish-npm:
    needs: [version, github-release]
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Stamp the version
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Publish to npm
        run: |
          name="$(node -p "require('./package.json').name")"
          if npm view "$name@$VERSION" version >/dev/null 2>&1; then
            echo "$name@$VERSION is already on npm; nothing to publish."
            exit 0
          fi
          npm publish --access public
